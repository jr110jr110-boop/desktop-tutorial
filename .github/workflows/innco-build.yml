name: INNCO API .NET 10 build

# Compiles the upgraded INNCO API on a clean Windows machine and stores the logs
# on the `innco-ci-results` branch. Secrets in appsettings.json are placeholders.

on:
  push:
    branches: [ innco-net10-build ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: innco-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    env:
      DOTNET_NOLOGO: 'true'
      DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Tool versions
        run: |
          mkdir -p ci-output
          dotnet --info > ci-output/0-dotnet-info.txt 2>&1 || true
          head -n 20 ci-output/0-dotnet-info.txt

      - name: Restore
        id: restore
        continue-on-error: true
        run: |
          set -o pipefail
          dotnet restore Base.sln 2>&1 | tee ci-output/1-restore.log

      - name: Build solution
        id: build
        if: steps.restore.outcome == 'success'
        continue-on-error: true
        run: |
          set -o pipefail
          dotnet build Base.sln --no-restore -c Release 2>&1 | tee ci-output/2-build.log

      - name: Build and run tests
        id: tests
        if: steps.build.outcome == 'success'
        continue-on-error: true
        run: |
          set -o pipefail
          dotnet test src/MsTests/MsTests.csproj -c Release 2>&1 | tee ci-output/3-tests.log

      - name: EF Core model check (migrations add)
        id: ef
        if: steps.build.outcome == 'success'
        continue-on-error: true
        working-directory: src/WebApi
        run: |
          set -o pipefail
          dotnet tool restore 2>&1 | tee ../../ci-output/4-ef.log
          # a new name generates a real migration to keep; Net10ModelCheck must come out empty
          NAME=$(cat ../../.github/migration-name.txt 2>/dev/null || echo Net10ModelCheck)
          dotnet ef migrations add "$NAME" --project ../DataLayer/DataLayer.csproj --startup-project WebApi.csproj --context ApplicationDbContext 2>&1 | tee -a ../../ci-output/4-ef.log
          mkdir -p ../../ci-output/migration
          cp ../DataLayer/Migrations/*"$NAME"* ../../ci-output/migration/
          cp ../DataLayer/Migrations/ApplicationDbContextModelSnapshot.cs ../../ci-output/migration/

      - name: Summary
        if: always()
        run: |
          {
            echo "sha=${{ github.sha }}"
            echo "restore=${{ steps.restore.outcome }}"
            echo "build=${{ steps.build.outcome }}"
            echo "tests=${{ steps.tests.outcome }}"
            echo "ef=${{ steps.ef.outcome }}"
          } > ci-output/summary.txt
          cat ci-output/summary.txt

      - name: Publish logs to innco-ci-results branch
        if: always()
        run: |
          git config user.name "innco-ci"
          git config user.email "innco-ci@users.noreply.github.com"
          git checkout --orphan innco-ci-results
          # -f: the EF step changes tracked migration files, and an unborn branch has no tip to compare with
          git rm -rqf --cached .
          git add -f ci-output
          git commit -q -m "CI results for ${{ github.sha }}"
          git push -f origin innco-ci-results

      - name: Fail when the build failed
        if: steps.build.outcome != 'success'
        run: exit 1

  smoke:
    # Runs the API for real against an empty SQL Server (Linux container): 2022 and 2025 Express.
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - tag: '2022'
            image: '2022-latest'
            pid: 'Developer'
          - tag: '2025-express'
            image: '2025-latest'
            pid: 'Express'
    services:
      mssql:
        image: mcr.microsoft.com/mssql/server:${{ matrix.image }}
        env:
          ACCEPT_EULA: 'Y'
          MSSQL_PID: ${{ matrix.pid }}
          MSSQL_SA_PASSWORD: 'Ci_Sql_Passw0rd_2026'
        ports:
          - 1433:1433
    env:
      DOTNET_NOLOGO: 'true'
      DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build WebApi
        run: |
          set -o pipefail
          mkdir -p smoke-output
          dotnet build src/WebApi/WebApi.csproj -c Release 2>&1 | tee smoke-output/1-build.log

      - name: Put the built front-end into wwwroot (served by the API)
        run: |
          mkdir -p src/WebApi/wwwroot
          cp -r .github/ci-frontend-dist/. src/WebApi/wwwroot/
          ls src/WebApi/wwwroot

      - name: Wait for SQL Server
        run: |
          for i in $(seq 1 90); do (echo > /dev/tcp/127.0.0.1/1433) >/dev/null 2>&1 && break; sleep 2; done
          sleep 25
          for t in /opt/mssql-tools18/bin/sqlcmd /opt/mssql-tools/bin/sqlcmd; do
            docker exec ${{ job.services.mssql.id }} $t -C -S localhost -U sa -P 'Ci_Sql_Passw0rd_2026' -h -1 \
              -Q "SET NOCOUNT ON; SELECT @@VERSION; SELECT SERVERPROPERTY('Edition')" > smoke-output/0-sql-version.txt 2>&1 && break
          done
          cat smoke-output/0-sql-version.txt || true

      - name: Run API and call endpoints
        continue-on-error: true
        env:
          ASPNETCORE_ENVIRONMENT: Development
          Production__Jobs: 'false'  # the 02:00 production jobs must not interfere with the fixed smoke data
          Service__Jobs: 'false'  # the 03:00 after-sales service jobs must not interfere with the fixed smoke data
          Quality__Jobs: 'false'  # the 04:00 quality jobs (CAPA escalation, scheduled document revisions) must not interfere with the fixed smoke data
          Service__AllowFutureAsOf: 'true'  # the smoke runs the service jobs by hand for injected future days (off everywhere else)
          Ai__Jobs: 'false'  # the scheduled AI seats must not run on their own; the smoke runs them by hand
          Ceo__Jobs: 'false'  # the 00:30 CEO dashboard snapshot must not run on its own; the smoke takes it by hand (POST api/v1/ceo/snapshot)
          Sepidar__LegacyCsv: 'true'  # R1t (D19): the old Sepidar CSV channels are off by default and, when on, for FINANCEMANAGER only; the smoke uses them as the finance manager and checks that the PMO is refused
          Pc__Jobs: 'false'  # the project-control jobs (weekly snapshot, guarantee expiry, 01:00 milestone evaluation) must not run on their own; the smoke runs them by hand
          Balance__Jobs: 'false'  # the PB2 nightly material balance and kit job must not run on their own; the smoke runs them by hand
          Warehouse__Jobs: 'false'  # the PB5 daily consignment and incoming-inspection alerts must not run on their own; the smoke runs them by hand
          OpsData__Jobs: 'false'  # the PB8 daily OPS-DATA data-control seat must not run on its own; the smoke runs it by hand
          Office__Jobs: 'false'  # the office jobs (task reminders, recurring tasks, waiting-approval reminders) must not run on their own; the smoke runs them by hand
          Integrity__Jobs: 'false'  # the 02:30 audit-chain verification must not run on its own; the smoke runs it by hand (POST api/v1/integrity/chain/run)
          AdminUserSeed__Password: 'Ci#Adm1n-Build-2026'  # CI-only test password; the repo and the package carry the placeholder
          AdminUserSeed__MustChangePassword: 'false'  # the smoke signs in as Admin with the seed password; the install test (job install-test) covers the forced first password change
          Identity__ApproverMinDays: '0'  # the smoke makes its second PMO seconds before that user approves; everywhere else the approver must have held PMO for Identity:ApproverMinDays (1 day)
          Identity__RateLimitPerMinute: '1000'  # the smoke signs in many test users from one address; everywhere else 20 per minute per address
          Identity__AuditHmacKey: 'ci-only-audit-hmac-key-8f3a91c2d47e6b05-not-a-secret'  # CI-only key of the keyed hash that the audit trail writes next to a masked national code, phone or IBAN
          ASPNETCORE_URLS: http://127.0.0.1:5080
          ConnectionStrings__SqlServer__ApplicationDbContextConnection: 'Data Source=127.0.0.1,1433;Initial Catalog=IRNNCO_CI;User ID=sa;Password=Ci_Sql_Passw0rd_2026;TrustServerCertificate=True;'
        run: bash .github/scripts/smoke.sh

      - name: Start the mock local AI endpoints (chat, embeddings, speech)
        run: bash .github/ci-tools/mock-llm/start.sh
      - name: Warehouse and traceability scenario
        continue-on-error: true
        env:
          ASPNETCORE_ENVIRONMENT: Development
          Production__Jobs: 'false'  # the 02:00 production jobs must not interfere with the fixed smoke data
          Production__MaxBackdateDays: '3650'  # this scenario only, and for one step: the correction bookings (production/bookings/correct) of the completed order C are dated 2026-06-27, the day of the seeded Tir attendance of ATT01 (a correction must fit in the attendance of its day, and the attendance of the smoke is seeded on fixed dates), far more than the 7 days a correction may reach back by default; every other booking, edit and correction of the scenario is inside the default (the supervisor's bookings are not limited by it at all); the scenario breaks about ten years after that date
          Production__PoolMinPeople: '3'  # this scenario only: it has three people with a payslip, so the monthly labour variance is published from 3 payroll-rated people, the lowest value the code accepts (the default is 5); the dominance limits stay at their defaults (0.50 and 0.80)
          Service__Jobs: 'false'  # the 03:00 after-sales service jobs must not interfere with the fixed smoke data
          Quality__Jobs: 'false'  # the 04:00 quality jobs (CAPA escalation, scheduled document revisions) must not interfere with the fixed smoke data
          Service__AllowFutureAsOf: 'true'  # the smoke runs the service jobs by hand for injected future days (off everywhere else)
          Ai__Jobs: 'false'  # the scheduled AI seats must not run on their own; the smoke runs them by hand
          Ceo__Jobs: 'false'  # the 00:30 CEO dashboard snapshot must not run on its own; the smoke takes it by hand (POST api/v1/ceo/snapshot)
          Sepidar__LegacyCsv: 'true'  # R1t (D19): the old Sepidar CSV channels are off by default and, when on, for FINANCEMANAGER only; the smoke uses them as the finance manager and checks that the PMO is refused
          Pc__Jobs: 'false'  # the project-control jobs (weekly snapshot, guarantee expiry, 01:00 milestone evaluation) must not run on their own; the smoke runs them by hand
          Balance__Jobs: 'false'  # the PB2 nightly material balance and kit job must not run on their own; the smoke runs them by hand
          Warehouse__Jobs: 'false'  # the PB5 daily consignment and incoming-inspection alerts must not run on their own; the smoke runs them by hand
          OpsData__Jobs: 'false'  # the PB8 daily OPS-DATA data-control seat must not run on its own; the smoke runs it by hand
          Office__Jobs: 'false'  # the office jobs (task reminders, recurring tasks, waiting-approval reminders) must not run on their own; the smoke runs them by hand
          Integrity__Jobs: 'false'  # the 02:30 audit-chain verification must not run on its own; the smoke runs it by hand (POST api/v1/integrity/chain/run)
          AdminUserSeed__Password: 'Ci#Adm1n-Build-2026'  # CI-only test password; the repo and the package carry the placeholder
          AdminUserSeed__MustChangePassword: 'false'  # the smoke signs in as Admin with the seed password; the install test (job install-test) covers the forced first password change
          Identity__ApproverMinDays: '0'  # the smoke makes its second PMO seconds before that user approves; everywhere else the approver must have held PMO for Identity:ApproverMinDays (1 day)
          Identity__RateLimitPerMinute: '1000'  # the smoke signs in many test users from one address; everywhere else 20 per minute per address
          Identity__AuditHmacKey: 'ci-only-audit-hmac-key-8f3a91c2d47e6b05-not-a-secret'  # CI-only key of the keyed hash that the audit trail writes next to a masked national code, phone or IBAN
          ASPNETCORE_URLS: http://127.0.0.1:5080
          ConnectionStrings__SqlServer__ApplicationDbContextConnection: 'Data Source=127.0.0.1,1433;Initial Catalog=IRNNCO_CI;User ID=sa;Password=Ci_Sql_Passw0rd_2026;TrustServerCertificate=True;'
        run: bash .github/scripts/inventory-smoke.sh

      - name: Query check (queries the GET requests cannot reach)
        continue-on-error: true
        working-directory: src/WebApi
        env:
          ASPNETCORE_ENVIRONMENT: Development
          Production__Jobs: 'false'  # the 02:00 production jobs must not interfere with the fixed smoke data
          Service__Jobs: 'false'  # the 03:00 after-sales service jobs must not interfere with the fixed smoke data
          Quality__Jobs: 'false'  # the 04:00 quality jobs (CAPA escalation, scheduled document revisions) must not interfere with the fixed smoke data
          Service__AllowFutureAsOf: 'true'  # the smoke runs the service jobs by hand for injected future days (off everywhere else)
          Ai__Jobs: 'false'  # the scheduled AI seats must not run on their own; the smoke runs them by hand
          Ceo__Jobs: 'false'  # the 00:30 CEO dashboard snapshot must not run on its own; the smoke takes it by hand (POST api/v1/ceo/snapshot)
          Sepidar__LegacyCsv: 'true'  # R1t (D19): the old Sepidar CSV channels are off by default and, when on, for FINANCEMANAGER only; the smoke uses them as the finance manager and checks that the PMO is refused
          Pc__Jobs: 'false'  # the project-control jobs (weekly snapshot, guarantee expiry, 01:00 milestone evaluation) must not run on their own; the smoke runs them by hand
          Balance__Jobs: 'false'  # the PB2 nightly material balance and kit job must not run on their own; the smoke runs them by hand
          Warehouse__Jobs: 'false'  # the PB5 daily consignment and incoming-inspection alerts must not run on their own; the smoke runs them by hand
          OpsData__Jobs: 'false'  # the PB8 daily OPS-DATA data-control seat must not run on its own; the smoke runs it by hand
          Office__Jobs: 'false'  # the office jobs (task reminders, recurring tasks, waiting-approval reminders) must not run on their own; the smoke runs them by hand
          Integrity__Jobs: 'false'  # the 02:30 audit-chain verification must not run on its own; the smoke runs it by hand (POST api/v1/integrity/chain/run)
          AdminUserSeed__Password: 'Ci#Adm1n-Build-2026'  # CI-only test password; the repo and the package carry the placeholder
          AdminUserSeed__MustChangePassword: 'false'  # the smoke signs in as Admin with the seed password; the install test (job install-test) covers the forced first password change
          Identity__ApproverMinDays: '0'  # the smoke makes its second PMO seconds before that user approves; everywhere else the approver must have held PMO for Identity:ApproverMinDays (1 day)
          Identity__RateLimitPerMinute: '1000'  # the smoke signs in many test users from one address; everywhere else 20 per minute per address
          Identity__AuditHmacKey: 'ci-only-audit-hmac-key-8f3a91c2d47e6b05-not-a-secret'  # CI-only key of the keyed hash that the audit trail writes next to a masked national code, phone or IBAN
          ConnectionStrings__SqlServer__ApplicationDbContextConnection: 'Data Source=127.0.0.1,1433;Initial Catalog=IRNNCO_CI;User ID=sa;Password=Ci_Sql_Passw0rd_2026;TrustServerCertificate=True;'
        run: |
          set -o pipefail
          dotnet run --project ../../.github/ci-tools/QueryCheck/QueryCheck.csproj -c Release 2>&1 | tee ../../smoke-output/6-querycheck.log

      - name: Publish smoke results to innco-ci-smoke-<sql> branch
        if: always()
        run: |
          git config user.name "innco-ci"
          git config user.email "innco-ci@users.noreply.github.com"
          git checkout --orphan innco-ci-smoke-${{ matrix.tag }}
          git rm -rqf --cached .
          git add -f smoke-output
          git commit -q -m "Smoke results (SQL Server ${{ matrix.tag }}) for ${{ github.sha }}"
          git push -f origin innco-ci-smoke-${{ matrix.tag }}

      - name: Fail the job unless the warehouse and finance scenario finished with 0 failed
        if: always()
        run: |
          # the scenario step is continue-on-error so that the results are always published; this step makes the job honest
          line=$(grep -E '^--- inventory: [0-9]+ passed, [0-9]+ failed' smoke-output/7-inventory.txt | tail -n 1 || true)
          echo "summary: ${line:-<missing>}"
          if [ -z "$line" ]; then echo "::error::the scenario did not print its summary line (it ended early)"; exit 1; fi
          failed=$(echo "$line" | sed -E 's/.* ([0-9]+) failed.*/\1/')
          if [ "$failed" != "0" ]; then echo "::error::$failed smoke checks failed"; grep '^FAIL' smoke-output/7-inventory.txt | head -50; exit 1; fi

      - name: Fail the job unless the start-up checks (front-end 404s, sign-out) finished with 0 failed
        if: always()
        run: |
          # R1a2 review (L-8b): smoke.sh counts its own checks (an "(expect ...)" echo checked nothing); its step is continue-on-error too, so this step makes the job honest about them
          line=$(grep -E '^--- checks: [0-9]+ passed, [0-9]+ failed' smoke-output/3-results.txt | tail -n 1 || true)
          echo "summary: ${line:-<missing>}"
          if [ -z "$line" ]; then echo "::error::the start-up smoke did not print its summary line (it ended early)"; exit 1; fi
          failed=$(echo "$line" | sed -E 's/.* ([0-9]+) failed.*/\1/')
          if [ "$failed" != "0" ]; then echo "::error::$failed start-up smoke checks failed"; grep '^FAIL' smoke-output/3-results.txt | head -20; exit 1; fi

  package:
    # Publishes the API (Release, framework-dependent, for IIS + .NET 10 Hosting Bundle) with the
    # front-end in wwwroot, and stores it on the innco-package branch.
    needs: build
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      DOTNET_NOLOGO: 'true'
      DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish WebApi
        run: |
          set -o pipefail
          mkdir -p package-output
          dotnet publish src/WebApi/WebApi.csproj -c Release -r win-x64 --self-contained false -o package-output/app 2>&1 | tee package-output/publish.log
          mkdir -p package-output/app/wwwroot
          cp -r .github/ci-frontend-dist/. package-output/app/wwwroot/
          # a delivered package never carries a password: install.ps1 sets the real one
          grep -q '"Password": "SET-BY-INSTALL-ps1"' package-output/app/appsettings.json || { echo "::error::package appsettings.json must carry the admin password placeholder"; exit 1; }
          if grep -rqF 'Ci#Adm1n-Build-2026' package-output/app; then echo "::error::the CI test password is in the package"; exit 1; fi
          cp deploy/install.ps1 deploy/backup.ps1 deploy/backup-crypto.ps1 deploy/restore-test.ps1 deploy/Install-PMIS-Server.ps1 deploy/Install-PMIS-Server.cmd package-output/
          mkdir -p package-output/test-kit && cp deploy/test-kit/Create-Test-Users.ps1 deploy/test-kit/Create-Test-Users.cmd package-output/test-kit/
          mkdir -p package-output/installers
          cp deploy/installers/README.txt package-output/installers/
          {
            echo "source_sha=${{ github.sha }}"
            echo "built_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            dotnet --version | sed 's/^/sdk=/'
            dotnet --list-runtimes | grep AspNetCore | tail -n1 | sed 's/^/aspnetcore_runtime=/'
          } > package-output/BUILD-INFO.txt
          cat package-output/BUILD-INFO.txt
          du -sh package-output/app

      - name: Store package on innco-package branch
        run: |
          git config user.name "innco-ci"
          git config user.email "innco-ci@users.noreply.github.com"
          git checkout --orphan innco-package
          git rm -rqf --cached .
          git add -f package-output
          git commit -q -m "Package for ${{ github.sha }}"
          git push -f origin innco-package

  install-test:
    # Runs install.ps1 end to end on a clean Windows Server with SQL Server 2022 Express, the way IT will:
    # 1) first install with an empty database, 2) an update run, 3) restore of the backup that run 1 made,
    # together with the uploaded files of an "old program" folder. Results go to the innco-ci-install branch.
    needs: package
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Get the CI scripts
        uses: actions/checkout@v4

      - name: Get the package
        uses: actions/checkout@v4
        with:
          ref: innco-package
          path: pkg

      - name: Install SQL Server 2022 Express
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path install-output | Out-Null
          choco install sql-server-express -y --no-progress --limit-output | Out-File install-output\0-sql-install.txt
          Get-Service -Name 'MSSQL*' | Format-Table -AutoSize Name, Status | Out-String | Tee-Object -Append install-output\0-sql-install.txt
          (Get-CimInstance Win32_OperatingSystem).Caption | Tee-Object -Append install-output\0-sql-install.txt

      - name: 1 - First install (empty database)
        continue-on-error: true
        shell: powershell
        run: |
          # Admin is made with this temporary password and must choose a new one at the first sign-in (MUST_CHANGE_PASSWORD): install-checks.ps1 (phase 1-first)
          # does that through Accounts/change-temporary-password, and phases 2 and 3 sign in with the new password. The site is HTTPS (self-signed certificate made by the installer).
          powershell -NoProfile -ExecutionPolicy Bypass -File .\pkg\package-output\install.ps1 -AdminPassword 'Ci#Adm1n-Install-2026' | Tee-Object -FilePath install-output\1-first-run.txt
          "exit=$LASTEXITCODE" | Tee-Object -Append -FilePath install-output\1-first-run.txt
          powershell -NoProfile -ExecutionPolicy Bypass -File .\.github\scripts\install-checks.ps1 -Phase 1-first

      - name: 2 - Update run (keeps database, settings and files)
        continue-on-error: true
        shell: powershell
        run: |
          # the update runs the way IT does it: double-click Install-PMIS-Server.cmd (backup first, then install with the existing folders),
          # from a copy of the package in a folder whose name has spaces, brackets and Persian letters (a second browser download is named "x (1)")
          $fa = -join ([char[]](0x0646, 0x0635, 0x0628))
          $dir = "D:\PMIS Install (1)\$fa\INNCO_Setup"
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          Copy-Item .\pkg\package-output\* $dir -Recurse -Force
          $ErrorActionPreference = 'Continue'
          $env:PMIS_NO_PAUSE = '1'
          # cmd.exe gets the launcher through an environment variable (Unicode-safe) from a plain ASCII runner, the way Explorer starts it
          $env:PMIS_TARGET = "$dir\Install-PMIS-Server.cmd"
          Set-Content -Path "$env:RUNNER_TEMP\run-install.cmd" -Encoding ASCII -Value '@call "%PMIS_TARGET%" -NoPrompt'
          & cmd.exe /c "$env:RUNNER_TEMP\run-install.cmd" 2>&1 | ForEach-Object { "$_" } | Tee-Object -FilePath install-output\2-update-run.txt
          "exit=$LASTEXITCODE" | Tee-Object -Append -FilePath install-output\2-update-run.txt
          Copy-Item "$dir\install-launch-log.txt" install-output\2-update-launch-log.txt -ErrorAction SilentlyContinue
          powershell -NoProfile -ExecutionPolicy Bypass -File .\.github\scripts\install-checks.ps1 -Phase 2-update

      - name: 3 - Restore the backup and bring over old uploaded files
        continue-on-error: true
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path D:\Import\old-app\UploadedDocuments, D:\Import\old-app\wwwroot\Documents | Out-Null
          Set-Content -Path D:\Import\old-app\UploadedDocuments\old-upload.txt -Value 'old upload'
          Set-Content -Path D:\Import\old-app\wwwroot\Documents\old-doc.txt -Value 'old document'
          # fresh backup through the scheduled task, so it contains the document uploaded in step 1
          $started = Get-Date
          Start-ScheduledTask -TaskName 'INNCO daily backup'
          do { Start-Sleep -Seconds 5; $info = Get-ScheduledTaskInfo -TaskName 'INNCO daily backup' }
          while ((Get-ScheduledTask -TaskName 'INNCO daily backup').State -eq 'Running' -or $info.LastRunTime -lt $started.AddSeconds(-5))
          "backup task result=$($info.LastTaskResult)" | Tee-Object -FilePath install-output\3-restore-run-backup.txt
          # on SQL Server Express (and whenever the backup is encrypted at file level) the newest backup is x.bak.enc: install.ps1 -RestoreBackup decrypts it with the sealed key of this server
          $bak = Get-ChildItem D:\INNCO\Backup\database -File | Where-Object { $_.Name -match '\.bak(\.enc)?$' } | Sort-Object LastWriteTime | Select-Object -Last 1
          $import = if ($bak.Name -like '*.enc') { 'D:\Import\IRNNCO.bak.enc' } else { 'D:\Import\IRNNCO.bak' }
          Copy-Item $bak.FullName $import
          powershell -NoProfile -ExecutionPolicy Bypass -File .\pkg\package-output\install.ps1 -RestoreBackup $import -ReplaceDatabase -UploadedFilesFrom D:\Import\old-app | Tee-Object -FilePath install-output\3-restore-run.txt
          "exit=$LASTEXITCODE" | Tee-Object -Append -FilePath install-output\3-restore-run.txt
          powershell -NoProfile -ExecutionPolicy Bypass -File .\.github\scripts\install-checks.ps1 -Phase 3-restore

      - name: 5 - Restore test (the monthly task, run once; Package D)
        continue-on-error: true
        shell: powershell
        run: |
          # the scheduled task "INNCO monthly restore test" restores the newest backup (x.bak.enc on Express) into IRNNCO_RESTORETEST, checks it, drops it and writes a result file;
          # install-checks.ps1 (phase 5-restore-test) checks the task, the result file, that the scratch database is gone and that the program reads the result
          $ErrorActionPreference = 'Continue'
          $started = Get-Date
          Start-ScheduledTask -TaskName 'INNCO monthly restore test'
          do { Start-Sleep -Seconds 5; $info = Get-ScheduledTaskInfo -TaskName 'INNCO monthly restore test' }
          while ((Get-ScheduledTask -TaskName 'INNCO monthly restore test').State -eq 'Running' -or $info.LastRunTime -lt $started.AddSeconds(-5))
          "restore test task result=$($info.LastTaskResult)" | Tee-Object -FilePath install-output\5-restore-test-run.txt
          Get-Content D:\INNCO\Backup\restore-test\restore-test-log.txt -ErrorAction SilentlyContinue | Tee-Object -Append -FilePath install-output\5-restore-test-run.txt
          powershell -NoProfile -ExecutionPolicy Bypass -File .\.github\scripts\install-checks.ps1 -Phase 5-restore-test

      - name: 4 - Create the test users with Create-Test-Users.cmd (test kit)
        continue-on-error: true
        shell: powershell
        run: |
          # the test kit's launcher, run from a folder with spaces, brackets and Persian letters, against the restored server; then every user signs in with his own password
          $ErrorActionPreference = 'Continue'
          $out = 'install-output\checks-4-test-users.txt'
          $fa = -join ([char[]](0x0622, 0x0632, 0x0645, 0x0648, 0x0646))
          $dir = "D:\PMIS Test Kit (1)\$fa"
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          Copy-Item .\pkg\package-output\test-kit\* $dir -Force
          function NewPw { 'Ci' + [guid]::NewGuid().ToString('N').Substring(0, 12) + '7k' }
          $yes = -join ([char[]](0x0628, 0x0644, 0x0647)); $no = -join ([char[]](0x062E, 0x06CC, 0x0631))
          $rows = @(
            [pscustomobject]@{ username = 'pmo.test'; password = (NewPw); roleIds = '1'; displayName = 'PMO test'; sensitive = $yes; phone = '09000000002'; nationalCode = '0012340014'; email = 'pmo-test@example.test' },
            [pscustomobject]@{ username = 'qc.test'; password = (NewPw); roleIds = '5'; displayName = 'QC test'; sensitive = $no; phone = '09000000010'; nationalCode = '0012340091'; email = 'qc-test@example.test' },
            [pscustomobject]@{ username = 'wh.test'; password = (NewPw); roleIds = '6'; displayName = 'Warehouse test'; sensitive = $no; phone = '09000000013'; nationalCode = '0012340121'; email = 'wh-test@example.test' },
            [pscustomobject]@{ username = 'finmgr.test'; password = (NewPw); roleIds = '17'; displayName = 'Finance manager test'; sensitive = $yes; phone = '09000000019'; nationalCode = '0012340189'; email = 'finmgr-test@example.test' }
          )
          $rows | Export-Csv -Path "$dir\Test-Users.csv" -NoTypeInformation -Encoding UTF8
          $env:PMIS_NO_PAUSE = '1'
          $env:PMIS_TARGET = "$dir\Create-Test-Users.cmd"
          Set-Content -Path "$env:RUNNER_TEMP\run-users.cmd" -Encoding ASCII -Value '@call "%PMIS_TARGET%" -BaseUrl http://127.0.0.1 -AdminPassword Own-Chosen-Pass-2026'
          & cmd.exe /c "$env:RUNNER_TEMP\run-users.cmd" 2>&1 | ForEach-Object { "$_" } | Tee-Object -FilePath install-output\4-test-users-run1.txt
          $rc1 = $LASTEXITCODE
          & cmd.exe /c "$env:RUNNER_TEMP\run-users.cmd" 2>&1 | ForEach-Object { "$_" } | Tee-Object -FilePath install-output\4-test-users-run2.txt
          $rc2 = $LASTEXITCODE
          $run1 = Get-Content install-output\4-test-users-run1.txt -Raw; $run2 = Get-Content install-output\4-test-users-run2.txt -Raw
          $lines = @()
          $lines += if ($rc1 -eq 0) { 'PASS run 1 ended with code 0' } else { "FAIL run 1 ended with code $rc1" }
          $lines += if ($run1 -match 'made: 4, existed already: 0, failed: 0, sensitive roles approved: 1, still waiting: 0') { 'PASS run 1 made 4 users and approved the 1 sensitive role' } else { 'FAIL run 1 summary: ' + (($run1 -split "`n") | Select-String 'Done\.' | Out-String).Trim() }
          $lines += if ($rc2 -eq 0) { 'PASS run 2 ended with code 0' } else { "FAIL run 2 ended with code $rc2" }
          $lines += if ($run2 -match 'made: 0, existed already: 4, failed: 0') { 'PASS run 2 skips the 4 existing users' } else { 'FAIL run 2 summary: ' + (($run2 -split "`n") | Select-String 'Done\.' | Out-String).Trim() }
          foreach ($r in $rows) {
            try {
              $resp = Invoke-RestMethod -UseBasicParsing -Method Post -Uri 'http://127.0.0.1/api/v1/Accounts/login' -ContentType 'application/json' -Body (@{ userName = $r.username; password = $r.password } | ConvertTo-Json)
              $lines += if ($resp.success -and $resp.data.accessToken) { "PASS $($r.username) signs in with the password of the users file" } else { "FAIL $($r.username) sign-in: $($resp.message)" }
            } catch { $lines += "FAIL $($r.username) sign-in: $($_.Exception.Message)" }
          }
          $lines | Set-Content -Path $out -Encoding UTF8
          $lines

      - name: Collect logs
        if: always()
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'
          $o = 'install-output'
          New-Item -ItemType Directory -Force -Path "$o\logs" | Out-Null
          Copy-Item D:\INNCO\logs\* "$o\logs" -Recurse -ErrorAction SilentlyContinue
          Copy-Item D:\INNCO\Backup\backup-log.txt $o -ErrorAction SilentlyContinue
          Get-ChildItem D:\INNCO -Recurse -Depth 2 | Select-Object FullName, Length | Format-Table -AutoSize | Out-String -Width 300 | Set-Content "$o\tree.txt"
          foreach ($d in 'D:\INNCO', 'D:\INNCO\app', 'D:\INNCO\app\UploadedDocuments', 'D:\INNCO\app\appsettings.Production.json', 'D:\INNCO\logs', 'D:\INNCO\Backup') { & icacls.exe $d | Out-File -Append "$o\acl.txt" }
          Get-WinEvent -FilterHashtable @{ LogName = 'Application'; ProviderName = 'IIS AspNetCore Module V2' } -MaxEvents 40 -ErrorAction SilentlyContinue |
            Format-List TimeCreated, Id, Message | Out-String -Width 300 | Set-Content "$o\eventlog-ancm.txt"
          Get-ChildItem C:\inetpub\logs\LogFiles -Recurse -Filter *.log -ErrorAction SilentlyContinue | ForEach-Object { Get-Content $_.FullName -Tail 60 } | Set-Content "$o\iis-access-tail.txt"
          Import-Module WebAdministration
          Get-Website | Format-Table -AutoSize Name, State, PhysicalPath, @{n='Bindings';e={($_.bindings.Collection | ForEach-Object { $_.bindingInformation }) -join ', '}} | Out-String -Width 300 | Set-Content "$o\iis-sites.txt"
          Get-ItemProperty IIS:\AppPools\INNCO | Select-Object name, state, managedRuntimeVersion, startMode | Format-List | Out-String | Add-Content "$o\iis-sites.txt"
          Get-ChildItem $o -Filter '*-run.txt' | ForEach-Object { $t = Get-Content $_.FullName; $t | Set-Content -Encoding UTF8 $_.FullName }
          exit 0

      - name: Publish install results to innco-ci-install branch
        if: always()
        shell: bash
        run: |
          git config user.name "innco-ci"
          git config user.email "innco-ci@users.noreply.github.com"
          git checkout --orphan innco-ci-install
          git rm -rqf --cached .
          git add -f install-output
          git commit -q -m "Install test for ${{ github.sha }}"
          git push -f origin innco-ci-install
