name: INNCO API .NET 10 build

# Compiles the upgraded INNCO API on a clean Windows machine and stores the logs
# on the `innco-ci-results` branch. Secrets in appsettings.json are placeholders.

on:
  push:
    branches: [ innco-net10-build ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: innco-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    env:
      DOTNET_NOLOGO: 'true'
      DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Tool versions
        run: |
          mkdir -p ci-output
          dotnet --info > ci-output/0-dotnet-info.txt 2>&1 || true
          head -n 20 ci-output/0-dotnet-info.txt

      - name: Restore
        id: restore
        continue-on-error: true
        run: |
          set -o pipefail
          dotnet restore Base.sln 2>&1 | tee ci-output/1-restore.log

      - name: Build solution
        id: build
        if: steps.restore.outcome == 'success'
        continue-on-error: true
        run: |
          set -o pipefail
          dotnet build Base.sln --no-restore -c Release 2>&1 | tee ci-output/2-build.log

      - name: Build and run tests
        id: tests
        if: steps.build.outcome == 'success'
        continue-on-error: true
        run: |
          set -o pipefail
          dotnet test src/MsTests/MsTests.csproj -c Release 2>&1 | tee ci-output/3-tests.log

      - name: EF Core model check (migrations add)
        id: ef
        if: steps.build.outcome == 'success'
        continue-on-error: true
        working-directory: src/WebApi
        run: |
          set -o pipefail
          dotnet tool restore 2>&1 | tee ../../ci-output/4-ef.log
          dotnet ef migrations add Net10ModelCheck --project ../DataLayer/DataLayer.csproj --startup-project WebApi.csproj --context ApplicationDbContext 2>&1 | tee -a ../../ci-output/4-ef.log
          mkdir -p ../../ci-output/migration
          cp ../DataLayer/Migrations/*Net10ModelCheck* ../../ci-output/migration/
          cp ../DataLayer/Migrations/ApplicationDbContextModelSnapshot.cs ../../ci-output/migration/

      - name: Summary
        if: always()
        run: |
          {
            echo "sha=${{ github.sha }}"
            echo "restore=${{ steps.restore.outcome }}"
            echo "build=${{ steps.build.outcome }}"
            echo "tests=${{ steps.tests.outcome }}"
            echo "ef=${{ steps.ef.outcome }}"
          } > ci-output/summary.txt
          cat ci-output/summary.txt

      - name: Publish logs to innco-ci-results branch
        if: always()
        run: |
          git config user.name "innco-ci"
          git config user.email "innco-ci@users.noreply.github.com"
          git checkout --orphan innco-ci-results
          # -f: the EF step changes tracked migration files, and an unborn branch has no tip to compare with
          git rm -rqf --cached .
          git add -f ci-output
          git commit -q -m "CI results for ${{ github.sha }}"
          git push -f origin innco-ci-results

      - name: Fail when the build failed
        if: steps.build.outcome != 'success'
        run: exit 1

  smoke:
    # Runs the API for real against an empty SQL Server 2022 (Linux container).
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: 'Y'
          MSSQL_SA_PASSWORD: 'Ci_Sql_Passw0rd_2026'
        ports:
          - 1433:1433
    env:
      DOTNET_NOLOGO: 'true'
      DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build WebApi
        run: |
          set -o pipefail
          mkdir -p smoke-output
          dotnet build src/WebApi/WebApi.csproj -c Release 2>&1 | tee smoke-output/1-build.log

      - name: Wait for SQL Server
        run: |
          for i in $(seq 1 90); do (echo > /dev/tcp/127.0.0.1/1433) >/dev/null 2>&1 && break; sleep 2; done
          sleep 25

      - name: Run API and call endpoints
        continue-on-error: true
        env:
          ASPNETCORE_ENVIRONMENT: Development
          ASPNETCORE_URLS: http://127.0.0.1:5080
          ConnectionStrings__SqlServer__ApplicationDbContextConnection: 'Data Source=127.0.0.1,1433;Initial Catalog=IRNNCO_CI;User ID=sa;Password=Ci_Sql_Passw0rd_2026;TrustServerCertificate=True;'
        run: bash .github/scripts/smoke.sh

      - name: Query check (queries the GET requests cannot reach)
        continue-on-error: true
        working-directory: src/WebApi
        env:
          ASPNETCORE_ENVIRONMENT: Development
          ConnectionStrings__SqlServer__ApplicationDbContextConnection: 'Data Source=127.0.0.1,1433;Initial Catalog=IRNNCO_CI;User ID=sa;Password=Ci_Sql_Passw0rd_2026;TrustServerCertificate=True;'
        run: |
          set -o pipefail
          dotnet run --project ../../.github/ci-tools/QueryCheck/QueryCheck.csproj -c Release 2>&1 | tee ../../smoke-output/6-querycheck.log

      - name: Publish smoke results to innco-ci-smoke branch
        if: always()
        run: |
          git config user.name "innco-ci"
          git config user.email "innco-ci@users.noreply.github.com"
          git checkout --orphan innco-ci-smoke
          git rm -rqf --cached .
          git add -f smoke-output
          git commit -q -m "Smoke results for ${{ github.sha }}"
          git push -f origin innco-ci-smoke
